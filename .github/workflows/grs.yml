name: Update README cards

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/grs.yml'
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card (dark)
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&include_all_commits=true&rank_icon=percentile&theme=github_dark
          path: profile/stats_dark.svg
          token: ${{ secrets.GH_TOKEN }}

      - name: Generate stats card (light)
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&include_all_commits=true&rank_icon=percentile&theme=default
          path: profile/stats_light.svg
          token: ${{ secrets.GH_TOKEN }}

      - name: Generate top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&theme=github_dark
          path: profile/top-langs_dark.svg
          token: ${{ secrets.GH_TOKEN }}

      - name: Generate top languages card (light)
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&theme=default
          path: profile/top-langs_light.svg
          token: ${{ secrets.GH_TOKEN }}

      # AI-Marker-Suite
      - name: Generate AI-Marker-Suite card (dark)
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=AI-Marker-Suite&hide_border=true&theme=github_dark
          path: profile/pinned-AI-Marker-Suite_dark.svg
          token: ${{ secrets.GH_TOKEN }}

      - name: Generate AI-Marker-Suite card (light)
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=AI-Marker-Suite&hide_border=true&theme=default
          path: profile/pinned-AI-Marker-Suite_light.svg
          token: ${{ secrets.GH_TOKEN }}

      # AI-Marker-Suite-Docs
      - name: Generate AI-Marker-Suite-Docs card (dark)
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=AI-Marker-Suite-Docs&hide_border=true&theme=github_dark
          path: profile/pinned-AI-Marker-Suite-Docs_dark.svg
          token: ${{ secrets.GH_TOKEN }}

      - name: Generate AI-Marker-Suite-Docs card (light)
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=AI-Marker-Suite-Docs&hide_border=true&theme=default
          path: profile/pinned-AI-Marker-Suite-Docs_light.svg
          token: ${{ secrets.GH_TOKEN }}

      # HoHai110 Frontend
      - name: Generate HoHai110_frontend card (dark)
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=HoHai110_frontend&hide_border=true&theme=github_dark
          path: profile/pinned-HoHai110-frontend_dark.svg
          token: ${{ secrets.GH_TOKEN }}

      - name: Generate HoHai110_frontend card (light)
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=HoHai110_frontend&hide_border=true&theme=default
          path: profile/pinned-HoHai110-frontend_light.svg
          token: ${{ secrets.GH_TOKEN }}

      # HoHai110 Backend
      - name: Generate HoHai110_backend card (dark)
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=HoHai110_backend&hide_border=true&theme=github_dark
          path: profile/pinned-HoHai110-backend_dark.svg
          token: ${{ secrets.GH_TOKEN }}

      - name: Generate HoHai110_backend card (light)
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=HoHai110_backend&hide_border=true&theme=default
          path: profile/pinned-HoHai110-backend_light.svg
          token: ${{ secrets.GH_TOKEN }}

      # ZhiXueMatrix
      - name: Generate ZhiXueMatrix card (dark)
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=ZhiXueMatrix&hide_border=true&theme=github_dark
          path: profile/pinned-ZhiXueMatrix_dark.svg
          token: ${{ secrets.GH_TOKEN }}

      - name: Generate ZhiXueMatrix card (light)
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=ZhiXueMatrix&hide_border=true&theme=default
          path: profile/pinned-ZhiXueMatrix_light.svg
          token: ${{ secrets.GH_TOKEN }}

      # EduAgent
      - name: Generate EduAgent card (dark)
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=EduAgent&hide_border=true&theme=github_dark
          path: profile/pinned-EduAgent_dark.svg
          token: ${{ secrets.GH_TOKEN }}

      - name: Generate EduAgent card (light)
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=EduAgent&hide_border=true&theme=default
          path: profile/pinned-EduAgent_light.svg
          token: ${{ secrets.GH_TOKEN }}

      # Cardan
      - name: Generate Cardan card (dark)
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Cardan&hide_border=true&theme=github_dark
          path: profile/pinned-Cardan_dark.svg
          token: ${{ secrets.GH_TOKEN }}

      - name: Generate Cardan card (light)
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Cardan&hide_border=true&theme=default
          path: profile/pinned-Cardan_light.svg
          token: ${{ secrets.GH_TOKEN }}

      - name: Commit cards
        run: |
          if grep -q "Something went wrong" profile/*.svg; then
            echo "::error::Generated SVGs contain errors, skipping commit"
            exit 1
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
