name: Update README cards

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/grs.yml'
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

# 新增项目：在 matrix.include 的 pin 里加一行即可（dark / light 各一行）
jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- stats ----
          - { theme: dark,  theme_name: github_dark, card: stats,     out: stats,     opts: "show_icons=true&hide_border=true&include_all_commits=true&rank_icon=percentile" }
          - { theme: light, theme_name: default,     card: stats,     out: stats,     opts: "show_icons=true&hide_border=true&include_all_commits=true&rank_icon=percentile" }
          # ---- top languages ----
          - { theme: dark,  theme_name: github_dark, card: top-langs, out: top-langs, opts: "layout=compact&langs_count=6&hide_border=true" }
          - { theme: light, theme_name: default,     card: top-langs, out: top-langs, opts: "layout=compact&langs_count=6&hide_border=true" }
          # ---- featured pin ----
          - { theme: dark,  theme_name: github_dark, card: pin, out: pinned-AI-Marker-Suite, opts: "repo=AI-Marker-Suite&hide_border=true&title_bold=true" }
          - { theme: light, theme_name: default,     card: pin, out: pinned-AI-Marker-Suite, opts: "repo=AI-Marker-Suite&hide_border=true&title_bold=true" }
          # ---- project pins ----
          - { theme: dark,  theme_name: github_dark, card: pin, out: pinned-GravityLink, opts: "repo=GravityLink&hide_border=true" }
          - { theme: light, theme_name: default,     card: pin, out: pinned-GravityLink, opts: "repo=GravityLink&hide_border=true" }
          - { theme: dark,  theme_name: github_dark, card: pin, out: pinned-SimpleHomepage, opts: "repo=SimpleHomepage&hide_border=true" }
          - { theme: light, theme_name: default,     card: pin, out: pinned-SimpleHomepage, opts: "repo=SimpleHomepage&hide_border=true" }
          - { theme: dark,  theme_name: github_dark, card: pin, out: pinned-HoHai110-frontend, opts: "repo=HoHai110_frontend&hide_border=true" }
          - { theme: light, theme_name: default,     card: pin, out: pinned-HoHai110-frontend, opts: "repo=HoHai110_frontend&hide_border=true" }
          - { theme: dark,  theme_name: github_dark, card: pin, out: pinned-HoHai110-backend, opts: "repo=HoHai110_backend&hide_border=true" }
          - { theme: light, theme_name: default,     card: pin, out: pinned-HoHai110-backend, opts: "repo=HoHai110_backend&hide_border=true" }
          - { theme: dark,  theme_name: github_dark, card: pin, out: pinned-ZhiXueMatrix, opts: "repo=ZhiXueMatrix&hide_border=true" }
          - { theme: light, theme_name: default,     card: pin, out: pinned-ZhiXueMatrix, opts: "repo=ZhiXueMatrix&hide_border=true" }
          - { theme: dark,  theme_name: github_dark, card: pin, out: pinned-EduAgent, opts: "repo=EduAgent&hide_border=true" }
          - { theme: light, theme_name: default,     card: pin, out: pinned-EduAgent, opts: "repo=EduAgent&hide_border=true" }
          - { theme: dark,  theme_name: github_dark, card: pin, out: pinned-Cardan, opts: "repo=Cardan&hide_border=true" }
          - { theme: light, theme_name: default,     card: pin, out: pinned-Cardan, opts: "repo=Cardan&hide_border=true" }
          - { theme: dark,  theme_name: github_dark, card: pin, out: pinned-Pyrojewel, opts: "repo=Pyrojewel&hide_border=true" }
          - { theme: light, theme_name: default,     card: pin, out: pinned-Pyrojewel, opts: "repo=Pyrojewel&hide_border=true" }
    steps:
      - uses: actions/checkout@v4

      - name: Generate ${{ matrix.out }}_${{ matrix.theme }}
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: ${{ matrix.card }}
          options: username=${{ github.repository_owner }}&${{ matrix.opts }}&theme=${{ matrix.theme_name }}
          path: profile/${{ matrix.out }}_${{ matrix.theme }}.svg
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: card-${{ matrix.out }}-${{ matrix.theme }}
          path: profile/${{ matrix.out }}_${{ matrix.theme }}.svg
          if-no-files-found: error

  commit:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: profile
          merge-multiple: true

      - name: Commit cards
        run: |
          if grep -q "Something went wrong" profile/*.svg; then
            echo "::error::Generated SVGs contain errors, skipping commit"
            exit 1
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git pull --rebase
          git push
